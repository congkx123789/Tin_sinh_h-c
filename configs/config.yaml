# Training Configurations

data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  gene_expression_file: "RNA_Seq.tsv"
  clinical_file: "Clinical.csv"

autoencoder:
  input_dim: 1000  # Will be updated based on preprocessed data
  latent_dim: 128
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  noise_factor: 0.2

lightgbm:
  learning_rate: 0.05
  num_leaves: 31
  feature_fraction: 0.8
  bagging_fraction: 0.8
  num_boost_round: 1000

paths:
  ae_checkpoints: "checkpoints/ae_weights/"
  lightgbm_checkpoints: "checkpoints/lightgbm_weights/"
